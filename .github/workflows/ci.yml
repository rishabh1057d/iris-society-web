name: CI
on:
  pull_request:
  push:
    branches: [main, feature/potw-platform]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: iris_potw_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --remote-name https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all --full-history"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.12.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm test:potw
      - run: pnpm test:potw:db
        env:
          POTW_TEST_DATABASE_URL: postgresql://postgres:local_test_only@localhost:5432/iris_potw_test
      - run: pnpm lint:potw
      - run: pnpm build
      - run: pnpm typecheck
      - name: Smoke-test the built site
        shell: bash
        run: |
          pnpm start > "$RUNNER_TEMP/iris-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node --input-type=module -e '
            let ready = false;
            for (let i = 0; i < 60; i++) {
              try { if ((await fetch("http://localhost:3000", {signal: AbortSignal.timeout(2000)})).ok) { ready = true; break; } } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!ready) process.exit(1);
          '
          pnpm test:smoke
